<!doctype html>
<html lang="en">
  <!--
    Preview harness for the card, with no Home Assistant anywhere.

    It stubs the two frontend elements the card renders (`ha-icon` and
    `ha-card`), hands it a fake `hass` whose callService writes to the log on
    the right, and loads the real bundle from dist/, so what you see is the
    built card. Every value is set up for this page only; nothing here ships.

    Run `bun run build` first (or `bun run start` in another terminal), then
    `bun run preview` and open the printed URL.

    ?bundle=... loads a different build, which is how a release artifact can be
    compared side by side:

      ?bundle=../released/lg-remote-control.js
  -->
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LG Remote Control card — preview harness</title>
    <style>
      :root {
        --primary-color: #03a9f4;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --secondary-background-color: #e8e8e8;
        --card-background-color: #ffffff;
        --ha-card-background: #ffffff;
        --error-color: #db4437;
        --divider-color: #e0e0e0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        background: #f4f5f7;
        color: var(--primary-text-color);
        font-family:
          Roboto,
          -apple-system,
          system-ui,
          sans-serif;
        display: flex;
        gap: 28px;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      p.hint {
        font-size: 12px;
        color: var(--secondary-text-color);
        margin: 0 0 12px;
      }
      .stage {
        background: var(--card-background-color);
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        padding: 16px;
      }
      .panel {
        width: 420px;
      }
      .log {
        background: #1e1e1e;
        color: #d7dae0;
        border-radius: 8px;
        padding: 10px 12px;
        font-family: "SF Mono", ui-monospace, Menlo, monospace;
        font-size: 11.5px;
        line-height: 1.5;
        max-height: 320px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .log .svc {
        color: #9cdcfe;
      }
      .log .data {
        color: #ce9178;
      }
      .log .empty {
        color: #6a737d;
      }
      .log .err {
        color: #f48771;
      }
      textarea {
        width: 100%;
        height: 190px;
        font-family: "SF Mono", ui-monospace, Menlo, monospace;
        font-size: 11.5px;
        border: 1px solid var(--divider-color);
        border-radius: 8px;
        padding: 10px;
        resize: vertical;
      }
      button.ghost {
        margin-top: 8px;
        background: transparent;
        border: 1px solid var(--divider-color);
        border-radius: 6px;
        padding: 5px 10px;
        cursor: pointer;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>lg-remote-control</h1>
      <p class="hint">
        Real card bundle, fake Home Assistant. Buttons call the mock
        <code>hass.callService</code> and show up in the log. Bundle:
        <code id="bundleName">…</code>
      </p>
      <div class="stage"><div id="cardHost"></div></div>
    </div>

    <div class="panel">
      <h1>Service calls</h1>
      <p class="hint">Exactly what the card sends, newest first.</p>
      <div class="log" id="log"><span class="empty">nothing yet — press something</span></div>
      <h1 style="margin-top: 18px">Card config</h1>
      <textarea id="configText" spellcheck="false"></textarea>
      <button class="ghost" id="apply">Rebuild card with this config</button>
    </div>

    <script>
      // --- minimal stand-ins for the Home Assistant frontend elements the card uses ---
      const ICONS = {
        "mdi:power": "⏻",
        "mdi:format-list-numbered": "☰",
        "mdi:undo-variant": "↩",
        "mdi:chevron-up": "⌃",
        "mdi:chevron-down": "⌄",
        "mdi:chevron-left": "‹",
        "mdi:chevron-right": "›",
        "mdi:volume-high": "🔊",
        "mdi:volume-medium": "🔉",
        "mdi:volume-mute": "🔇",
        "mdi:volume-off": "🔈",
        "mdi:information-variant": "ℹ",
        "mdi:play": "▶",
        "mdi:pause": "⏸",
        "mdi:stop": "⏹",
        "mdi:skip-backward": "⏮",
        "mdi:skip-forward": "⏭",
        "mdi:record": "⏺",
        "mdi:import": "⇥",
        "mdi:speaker": "🔈",
        "mdi:home": "⌂",
        "mdi:headphones": "🎧",
        "mdi:television-classic": "📺",
        "mdi:bluetooth": "ᛒ",
        "mdi:brightness-6": "🔆",
        "mdi:timer-outline": "⏱",
        "mdi:youtube-tv": "▶",
        "mdi:netflix": "N",
        "mdi:video-input-hdmi": "HDMI",
      };

      class HaIcon extends HTMLElement {
        static get observedAttributes() {
          return ["icon"];
        }
        connectedCallback() {
          this.style.display = "inline-flex";
          this.style.alignItems = "center";
          this.style.justifyContent = "center";
          this.style.width = "1.1em";
          this.style.height = "1.1em";
          this.style.fontSize = "0.95em";
          this.style.lineHeight = "1";
          this.render();
        }
        attributeChangedCallback() {
          this.render();
        }
        render() {
          const icon = this.getAttribute("icon") || "";
          this.textContent = ICONS[icon] || "▪";
          this.title = icon;
        }
      }
      customElements.define("ha-icon", HaIcon);

      class HaCard extends HTMLElement {
        connectedCallback() {
          this.style.display = "block";
          this.style.background = "var(--card-background-color)";
          this.style.borderRadius = "12px";
        }
      }
      customElements.define("ha-card", HaCard);

      // --- fake hass ---
      const logEl = document.getElementById("log");
      let logged = 0;
      function logCall(service, data) {
        if (logged === 0) logEl.innerHTML = "";
        logged += 1;
        const line = document.createElement("div");
        line.innerHTML =
          `<span class="svc">${service}</span> ` +
          `<span class="data">${JSON.stringify(data)}</span> ` +
          `<span style="color:#6a737d">${new Date().toLocaleTimeString()}</span>`;
        logEl.prepend(line);
      }
      window.addEventListener("error", (e) => {
        const line = document.createElement("div");
        line.className = "err";
        line.textContent = "JS error: " + e.message;
        logEl.prepend(line);
      });

      const hass = {
        states: {
          "media_player.lg_webos_tv": {
            entity_id: "media_player.lg_webos_tv",
            state: "on",
            attributes: {
              volume_level: 0.24,
              is_volume_muted: false,
              sound_output: "tv_speaker",
              source: "YouTube",
              source_list: ["YouTube", "Netflix", "HDMI 1", "HDMI 2", "Live TV"],
              app_id: "youtube.leanback.v4",
            },
          },
        },
        entities: {},
        callService(domain, service, data) {
          logCall(`${domain}.${service}`, data);
          return Promise.resolve();
        },
        callWS() {
          return Promise.resolve();
        },
      };

      const BASE_CONFIG = {
        type: "custom:lg-remote-control",
        entity: "media_player.lg_webos_tv",
        name: "Living Room OLED",
        mac: "AA:BB:CC:DD:EE:FF",
        color_buttons: false,
        sources: [
          { name: "Netflix", icon: "mdi:netflix" },
          { name: "YouTube", icon: "mdi:youtube-tv" },
          { name: "Prime Video", icon: "amazon" },
          { name: "Disney+", icon: "disney" },
        ],
        settings: {
          backlight: {
            service: "shell_command.lg_tv_backlight",
            data: { level: "$value" },
          },
          sleep_timer: {
            service: "shell_command.lg_tv_sleeptimer",
            data: { minutes: "$value" },
            options: ["off", 10, 20, 30, 60, 120],
          },
        },
      };

      const host = document.getElementById("cardHost");
      const configText = document.getElementById("configText");
      configText.value = JSON.stringify(BASE_CONFIG, null, 2);

      function build(config) {
        host.innerHTML = "";
        const card = document.createElement("lg-remote-control");
        card.hass = hass;
        card.setConfig(config);
        host.appendChild(card);
      }

      document.getElementById("apply").addEventListener("click", () => {
        try {
          build(JSON.parse(configText.value));
          logCall("(harness)", { rebuilt: true });
        } catch (err) {
          const line = document.createElement("div");
          line.className = "err";
          line.textContent = "config error: " + err.message;
          logEl.prepend(line);
        }
      });

      // handy from a console or an automated check
      window.__preview = { build, hass, log: (service, data) => logCall(service, data) };
    </script>

    <!-- the real card bundle: an ES module, as HACS loads it -->
    <script type="module">
      const params = new URLSearchParams(location.search);
      const bundle = params.get("bundle") || "../dist/lg-remote-control.js";
      document.getElementById("bundleName").textContent = bundle;
      await import(bundle);
      window.__preview.build(JSON.parse(document.getElementById("configText").value));
    </script>
  </body>
</html>
